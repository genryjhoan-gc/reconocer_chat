<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOODSITAX Trivia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D0D0D;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    max-width: 1300px;
    margin: 0 auto;
  }
  /* CHAT */
  .chat-panel {
    background: #1a1a1a;
    border: 2px solid #FF007F;
    border-radius: 12px;
    height: 650px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #FF007F;
    padding: 12px;
    font-weight: bold;
    text-align: center;
  }
  .chat-status {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 4px;
    font-weight: normal;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chat-msg {
    word-wrap: break-word;
    line-height: 1.4;
    font-size: 14px;
  }
  .chat-msg .user {
    font-weight: bold;
    color: #FF2FA0;
  }
  .chat-msg.match {
    background: rgba(255, 0, 127, 0.2);
    padding: 6px 8px;
    border-radius: 6px;
    border-left: 3px solid #FF007F;
  }
  .chat-emote {
    height: 28px;
    vertical-align: middle;
    margin: -4px 2px;
  }
  /* QUESTION */
  .question-panel {
    background: #1a1a1a;
    border: 2px solid #FF007F;
    border-radius: 12px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 650px;
    text-align: center;
  }
  .question-label {
    font-size: 14px;
    color: #FF2FA0;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 40px;
    margin-bottom: 40px;
    color: #fff;
    min-height: 60px;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #FF007F;
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
  }
  button:hover:not(:disabled) { background: #FF2FA0; transform: translateY(-2px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .info {
    margin-top: 24px;
    opacity: 0.55;
    font-size: 13px;
  }
  /* WINNER OVERLAY */
  .winner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .winner-overlay.active { display: flex; }
  .winner-card {
    background: #1a1a1a;
    border: 3px solid #FF007F;
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 0 60px #FF007F;
    animation: pop 0.35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .winner-title {
    font-size: 22px;
    color: #FF2FA0;
    margin-bottom: 10px;
    letter-spacing: 3px;
  }
  .winner-name {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 24px;
    color: #fff;
    word-break: break-word;
  }
  .winner-msg {
    background: #0D0D0D;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 28px;
    font-style: italic;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Chat de Twitch -->
  <div class="chat-panel">
    <div class="chat-header">
      CHAT DE TWITCH
      <div class="chat-status" id="status">Conectando...</div>
    </div>
    <div class="chat-messages" id="chat"></div>
  </div>

  <!-- Panel de pregunta -->
  <div class="question-panel">
    <div class="question-label" id="qlabel">Trivia</div>
    <div class="question-text" id="question">Presiona el botón para empezar</div>
    <div class="controls">
      <button id="btnStart">Mostrar pregunta</button>
      <button id="btnNext" disabled>Siguiente pregunta</button>
    </div>
    <div class="info" id="info">—</div>
  </div>
</div>

<!-- Overlay del ganador -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <div class="winner-title">¡GANADOR!</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="winner-msg" id="winnerMsg"></div>
    <button id="btnCloseWinner">Continuar</button>
  </div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN — EDITA AQUÍ
// ============================================================
const TWITCH_CHANNEL = 'gcelsuport';

const QUESTIONS = [
  {
    question: "¿a dónde voy?",
    keywords: ["casa", "casaa", "cas a", "  casa", "la casa"]
  },
  // Agrega más preguntas así:
  // {
  //   question: "¿pregunta 2?",
  //   keywords: ["palabra1", "palabra2", "otra palabra"]
  // },
];
// ============================================================

let currentQuestionIndex = -1;
let detectionActive = false;
let matchLocked = false; // Bloqueo duro: una vez que alguien acierta, NADIE más activa el overlay hasta la siguiente pregunta.
const thirdPartyEmotes = new Map(); // name -> URL (7TV channel emotes)

const chatEl = document.getElementById('chat');
const statusEl = document.getElementById('status');
const questionEl = document.getElementById('question');
const qlabelEl = document.getElementById('qlabel');
const infoEl = document.getElementById('info');
const btnStart = document.getElementById('btnStart');
const btnNext = document.getElementById('btnNext');
const btnCloseWinner = document.getElementById('btnCloseWinner');
const winnerOverlay = document.getElementById('winnerOverlay');
const winnerName = document.getElementById('winnerName');
const winnerMsg = document.getElementById('winnerMsg');

// Normaliza para matching: lowercase, sin acentos, espacios colapsados.
function normalize(str) {
  return str
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, ' ');
}

// Devuelve la keyword que matcheó, o null.
function checkMatch(message, keywords) {
  const normMsg = normalize(message);
  for (const kw of keywords) {
    const normKw = normalize(kw).trim();
    if (normKw && normMsg.includes(normKw)) {
      return kw;
    }
  }
  return null;
}

function addChatMessage(user, message, color, isMatch, twitchEmotes) {
  const div = document.createElement('div');
  div.className = 'chat-msg' + (isMatch ? ' match' : '');
  const userSpan = document.createElement('span');
  userSpan.className = 'user';
  userSpan.textContent = user + ': ';
  if (color) userSpan.style.color = color;
  div.appendChild(userSpan);
  div.appendChild(buildMessageNodes(message, twitchEmotes));
  chatEl.appendChild(div);

  // Mantener solo los últimos 100 mensajes
  while (chatEl.children.length > 100) {
    chatEl.removeChild(chatEl.firstChild);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

// Parsea el tag "emotes" del IRC de Twitch: "id:start-end,start-end/id:start-end"
function parseTwitchEmotes(emotesTag) {
  if (!emotesTag) return [];
  const result = [];
  emotesTag.split('/').forEach(group => {
    const [id, positions] = group.split(':');
    if (!id || !positions) return;
    positions.split(',').forEach(range => {
      const [s, e] = range.split('-').map(Number);
      if (!isNaN(s) && !isNaN(e)) result.push({ id, start: s, end: e });
    });
  });
  return result.sort((a, b) => a.start - b.start);
}

// Construye los nodos DOM del mensaje, reemplazando emotes Twitch nativos Y 7TV por <img>
function buildMessageNodes(message, twitchEmotes) {
  const fragment = document.createDocumentFragment();
  const emotes = twitchEmotes || [];
  // Usamos Array.from para iterar por code points (los emojis ocupan más de 1 char en UTF-16,
  // pero los índices del tag emotes están en code points). Para mensajes con solo ASCII no afecta.
  const chars = Array.from(message);
  let cursor = 0;

  for (const e of emotes) {
    if (e.start > cursor) {
      const textPart = chars.slice(cursor, e.start).join('');
      appendTextWithThirdParty(fragment, textPart);
    }
    const emoteName = chars.slice(e.start, e.end + 1).join('');
    appendTwitchEmote(fragment, emoteName, e.id);
    cursor = e.end + 1;
  }

  if (cursor < chars.length) {
    const textPart = chars.slice(cursor).join('');
    appendTextWithThirdParty(fragment, textPart);
  }
  return fragment;
}

// Para texto sin emote nativo: tokeniza por espacios y reemplaza emotes 7TV si coinciden.
function appendTextWithThirdParty(fragment, text) {
  if (thirdPartyEmotes.size === 0) {
    fragment.appendChild(document.createTextNode(text));
    return;
  }
  // Split conservando los espacios como tokens separados
  const tokens = text.split(/(\s+)/);
  for (const token of tokens) {
    if (token && thirdPartyEmotes.has(token)) {
      const img = document.createElement('img');
      img.className = 'chat-emote';
      img.alt = token;
      img.title = token;
      img.src = thirdPartyEmotes.get(token);
      fragment.appendChild(img);
    } else if (token) {
      fragment.appendChild(document.createTextNode(token));
    }
  }
}

function appendTwitchEmote(fragment, name, id) {
  const img = document.createElement('img');
  img.className = 'chat-emote';
  img.alt = name;
  img.title = name;
  // /default/ devuelve la versión animada si existe, si no la estática.
  img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/1.0`;
  fragment.appendChild(img);
}

function showWinner(user, message) {
  // Guard idempotente: si ya hay un ganador, no sobrescribir.
  if (winnerOverlay.classList.contains('active')) return;
  winnerName.textContent = user;
  winnerMsg.textContent = '"' + message + '"';
  winnerOverlay.classList.add('active');
  infoEl.textContent = '🔒 Detección pausada — presiona "Siguiente pregunta"';
}

function closeWinner() {
  winnerOverlay.classList.remove('active');
}

function showQuestion(index) {
  if (index < 0 || index >= QUESTIONS.length) return;
  currentQuestionIndex = index;
  questionEl.textContent = QUESTIONS[index].question;
  qlabelEl.textContent = `Pregunta ${index + 1}`;
  infoEl.textContent = `Pregunta ${index + 1} de ${QUESTIONS.length} — detectando palabras clave...`;
  matchLocked = false;
  detectionActive = true;
}

function endTrivia() {
  questionEl.textContent = '¡Trivia terminada!';
  qlabelEl.textContent = 'Fin';
  infoEl.textContent = '—';
  matchLocked = true;
  detectionActive = false;
  btnNext.disabled = true;
}

btnStart.addEventListener('click', () => {
  if (QUESTIONS.length === 0) {
    alert('No hay preguntas configuradas en el array QUESTIONS.');
    return;
  }
  showQuestion(0);
  btnStart.disabled = true;
  btnNext.disabled = false;
});

btnNext.addEventListener('click', () => {
  closeWinner();
  const next = currentQuestionIndex + 1;
  if (next < QUESTIONS.length) {
    showQuestion(next);
  } else {
    endTrivia();
  }
});

btnCloseWinner.addEventListener('click', closeWinner);

// === Conexión directa al IRC de Twitch vía WebSocket (anónima) ===
let twitchWS = null;
let reconnectTimer = null;

function connectTwitch() {
  statusEl.textContent = 'Conectando...';
  try {
    twitchWS = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  } catch (e) {
    statusEl.textContent = 'Error al crear WebSocket: ' + e.message;
    return;
  }

  twitchWS.onopen = () => {
    // Login anónimo: cualquier nombre que empiece con "justinfan" + número funciona sin token.
    const anonNick = 'justinfan' + Math.floor(Math.random() * 1000000);
    twitchWS.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    twitchWS.send('NICK ' + anonNick);
    twitchWS.send('JOIN #' + TWITCH_CHANNEL.toLowerCase());
    statusEl.textContent = `Conectado a #${TWITCH_CHANNEL}`;
  };

  twitchWS.onmessage = (event) => {
    const lines = event.data.split('\r\n');
    for (const line of lines) {
      if (!line) continue;
      handleIRCLine(line);
    }
  };

  twitchWS.onclose = () => {
    statusEl.textContent = 'Desconectado. Reintentando en 3s...';
    if (reconnectTimer) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectTwitch, 3000);
  };

  twitchWS.onerror = (err) => {
    console.error('WebSocket error', err);
    statusEl.textContent = 'Error de WebSocket (ver consola)';
  };
}

function handleIRCLine(line) {
  // Mantener viva la conexión: Twitch nos hace ping cada cierto tiempo, respondemos pong.
  if (line.startsWith('PING')) {
    twitchWS.send('PONG :tmi.twitch.tv');
    return;
  }
  const parsed = parseIRC(line);
  if (!parsed) return;
  if (parsed.command === 'ROOMSTATE' && parsed.tags['room-id']) {
    // Cuando entramos al canal, obtenemos su ID numérico → cargamos emotes 7TV.
    load7TVEmotes(parsed.tags['room-id']);
    return;
  }
  if (parsed.command === 'PRIVMSG') {
    onChatMessage(parsed);
  }
}

async function load7TVEmotes(twitchUserId) {
  try {
    const res = await fetch(`https://7tv.io/v3/users/twitch/${twitchUserId}`);
    if (!res.ok) {
      console.log('No hay perfil 7TV para este canal (status ' + res.status + ')');
      return;
    }
    const data = await res.json();
    const emotes = data?.emote_set?.emotes || [];
    let count = 0;
    for (const e of emotes) {
      const host = e.data?.host;
      if (!host || !host.url || !host.files) continue;
      // Preferir webp 2x; fallback a la primera disponible.
      const file = host.files.find(f => f.name === '2x.webp')
                || host.files.find(f => f.name === '1x.webp')
                || host.files.find(f => f.format === 'WEBP')
                || host.files[0];
      if (file) {
        const url = 'https:' + host.url + '/' + file.name;
        thirdPartyEmotes.set(e.name, url);
        count++;
      }
    }
    console.log(`Cargados ${count} emotes de 7TV para el canal.`);
  } catch (err) {
    console.error('Error cargando emotes 7TV:', err);
  }
}

// Parser mínimo de IRC con soporte de tags (lo que Twitch usa para display-name, color, etc.)
function parseIRC(line) {
  const tags = {};
  let rest = line;

  if (rest.startsWith('@')) {
    const sp = rest.indexOf(' ');
    if (sp === -1) return null;
    const tagPart = rest.substring(1, sp);
    rest = rest.substring(sp + 1);
    tagPart.split(';').forEach(t => {
      const eq = t.indexOf('=');
      if (eq === -1) tags[t] = '';
      else tags[t.substring(0, eq)] = t.substring(eq + 1);
    });
  }

  let prefix = '';
  if (rest.startsWith(':')) {
    const sp = rest.indexOf(' ');
    if (sp === -1) return null;
    prefix = rest.substring(1, sp);
    rest = rest.substring(sp + 1);
  }

  const sp = rest.indexOf(' ');
  if (sp === -1) return { tags, prefix, command: rest, params: '' };
  return {
    tags,
    prefix,
    command: rest.substring(0, sp),
    params: rest.substring(sp + 1)
  };
}

function onChatMessage(parsed) {
  // params tiene el formato: "#channel :texto del mensaje"
  const colonIdx = parsed.params.indexOf(' :');
  if (colonIdx === -1) return;
  let message = parsed.params.substring(colonIdx + 2);
  // Limpiar /me (mensajes de acción) - llegan envueltos en \u0001ACTION ...\u0001
  if (message.startsWith('\u0001ACTION ') && message.endsWith('\u0001')) {
    message = message.substring(8, message.length - 1);
  }
  const username = parsed.prefix.split('!')[0];
  const displayName = parsed.tags['display-name'] || username;
  const color = parsed.tags.color || '';
  const twitchEmotes = parseTwitchEmotes(parsed.tags.emotes);

  // === Misma lógica de detección y bloqueo de antes ===
  if (matchLocked || !detectionActive) {
    addChatMessage(displayName, message, color, false, twitchEmotes);
    return;
  }

  const matched = checkMatch(message, QUESTIONS[currentQuestionIndex].keywords);
  if (matched) {
    matchLocked = true;
    detectionActive = false;
    addChatMessage(displayName, message, color, true, twitchEmotes);
    showWinner(displayName, message);
    return;
  }

  addChatMessage(displayName, message, color, false, twitchEmotes);
}

connectTwitch();
</script>

</body>
</html>
